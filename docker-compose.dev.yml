# Dev front avec hot reload, sans toucher à la prod.
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Ensuite, chaque sauvegarde dans apps/front/src ou packages/* recharge https://localhost:8443
# automatiquement : plus besoin de rebuild le service front. La prod (docker compose up
# sans ce fichier) continue d'utiliser l'image buildée via apps/front/Dockerfile.
name: loltr

services:
  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile.dev
    volumes:
      - ./apps/front:/app/apps/front
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      # node_modules installés à l'image, masqués par les montages ci-dessus sinon
      - /app/apps/front/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/content/node_modules
    environment:
      # Inotify traverse les bind-mounts sur Linux : laisser à "0".
      # Mettre "1" uniquement sous Windows/Mac (Docker Desktop) où les
      # événements ne traversent pas toujours, au prix de CPU/RAM élevés.
      VITE_POLL_WATCH: "0"
