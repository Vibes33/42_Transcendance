# Configuration statique de Traefik : reverse proxy + passerelle API de LolTR.
entryPoints:
  # HTTP → HTTPS : redirection dans la configuration dynamique (middleware to-https), pour viser le
  # port HTTPS publié sur l'hôte (8443 en local) et non le port 443 du conteneur
  web:
    address: ":80"
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

ping: {}

log:
  level: WARN

accessLog: {}
