# Configuration statique de Traefik : reverse proxy + passerelle API de LolTR.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

ping: {}

log:
  level: WARN

accessLog: {}
